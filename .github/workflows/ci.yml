name: CoverWise CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run tests
        working-directory: backend
        run: |
          if [ -d tests ]; then
            pytest
          else
            echo "No backend tests yet"
          fi

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "Frontend not initialized yet"
          fi

      - name: Lint
        working-directory: frontend
        run: |
          if [ -f package.json ]; then
            npm run lint
          else
            echo "Frontend not initialized yet"
          fi

      - name: Build
        working-directory: frontend
        run: |
          if [ -f package.json ]; then
            npm run build
          else
            echo "Frontend not initialized yet"
          fi