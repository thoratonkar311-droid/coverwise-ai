services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: coverwise_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: coverwise
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coverwise"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: coverwise_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/coverwise
      ENVIRONMENT: production
      SECRET_KEY: replace_with_a_secure_random_key_in_production
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      OLLAMA_BASE_URL: http://ollama:11434
      LLM_MODEL: qwen2.5:7b
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/backend/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: coverwise_frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: ""
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - backend

  ollama:
    image: ollama/ollama:latest
    container_name: coverwise_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  uploads_data:
  ollama_data:
